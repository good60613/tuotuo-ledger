// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// 外掛（例如 @capacitor/filesystem）要求 Java 21 工具鏈；這台電腦只有 Android Studio 內建的 Java 25。
// 讓它們改用目前這份 Java 編譯，輸出仍是 Java 21 相容的程式碼（不影響 App 行為）。
subprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('kotlin') != null) {
            p.kotlin.jvmToolchain(Integer.parseInt(JavaVersion.current().majorVersion))
            p.kotlin.compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21 }
        }
    }
}
