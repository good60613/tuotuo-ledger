# 雲端打包試用版 APK：push 到 v 開頭的分支（例如 v3.3、v3.4-試做）或手動按〔Run workflow〕就會跑。
# 做出來的 APK 用正式金鑰簽章（跟電腦打包的同一把），可以直接覆蓋安裝，資料不會掉。
# 注意：刻意不用 pull_request 觸發。倉庫是公開的，外人的 PR 不該拿得到 Secrets（金鑰）。
name: 打包試用版 APK

on:
  push:
    branches: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安裝 JDK 21（Capacitor 8 / Android Gradle Plugin 9 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安裝套件
        run: npm ci

      - name: 型別檢查
        run: npm run typecheck

      - name: 跑測試
        run: npm test

      - name: 建置網頁
        run: npm run build

      - name: 同步到 Android 專案
        run: npx cap sync android

      - name: 檢查簽章金鑰 Secrets 有沒有設定
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::還沒設定簽章金鑰 Secrets，請看 文件/GitHub使用說明.md"
            exit 1
          fi

      - name: 還原簽章金鑰檔（只放在這次執行的暫存資料夾）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 打包 Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 改名並確認有簽章
        id: apk
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::讀不到 android/app/build.gradle 的 versionName"
            exit 1
          fi
          SRC=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::找不到簽好章的 APK（app-release.apk），打包可能沒有成功簽章"
            exit 1
          fi
          NAME="tuotuo-ledger-${VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"
          mkdir -p out
          cp "$SRC" "out/$NAME"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "out/$NAME" | grep -i "SHA-256" || true
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: 上傳 APK（保留 14 天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/${{ steps.apk.outputs.name }}
          retention-days: 14
          if-no-files-found: error
